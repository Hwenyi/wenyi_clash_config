# 仅保存策略组选择；不接管 OpenClash 的 DNS / Fake-IP 设置
profile:
  store-selected: true

proxy-groups:
  - name: "🎯 节点选择"
    type: select
    proxies:
      - "♻️ 自动选择"
      - "🌐 手动切换"
      - "☁️ 甲骨文圣何塞"
      - "🌐 全部节点"
      - DIRECT
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png"

  # 自动选择：对 Sub-Store 提供的全部节点测速；Oracle 两个节点刻意排除
  - name: "♻️ 自动选择"
    type: url-test
    include-all: true
    exclude-type: "direct|reject"
    exclude-filter: "(?i)^oracle-(vless-reality|hy2-hop)$"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png"

  # 手动切换：进入国家组；每个国家内部可选自动优选或手动指定具体节点
  - name: "🌐 手动切换"
    type: select
    proxies:
      - "🇭🇰 香港"
      - "🇯🇵 日本"
      - "🇹🇼 台湾"
      - "🇸🇬 新加坡"
      - "🇰🇷 韩国"
      - "🇺🇸 美国"
      - "🇬🇧 英国"
      - "🇩🇪 德国"
      - "🇫🇷 法国"
      - "🇮🇳 印度"
      - "🇧🇷 巴西"
      - "🇦🇺 澳大利亚"
      - "🇨🇦 加拿大"
      - "🇷🇺 俄罗斯"
      - "☁️ 甲骨文圣何塞"
      - "🌐 全部节点"
      - DIRECT
    icon: "https://raw.githubusercontent.com/Orz-3/mini/master/Color/Cylink.png"

  # 两个 Oracle 节点独立成组，不参与美国节点筛选和全局自动测速
  - name: "☁️ 甲骨文圣何塞"
    type: select
    include-all: true
    exclude-type: "direct|reject"
    filter: "(?i)^oracle-(vless-reality|hy2-hop)$"

  - name: "🌐 全部节点"
    type: select
    include-all: true
    exclude-type: "direct|reject"
    exclude-filter: "(?i)^oracle-(vless-reality|hy2-hop)$"

  # 香港 自动测速辅助组：由国家组内的「自动选择」入口调用
  - name: "🇭🇰 自动选择"
    type: url-test
    include-all: true
    exclude-type: "direct|reject"
    exclude-filter: "(?i)^oracle-(vless-reality|hy2-hop)$"
    filter: "(?i)(香港|Hong[ _-]?Kong|\\bHK\\b|HK[0-9_-]|🇭🇰)"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    timeout: 5000
    expected-status: 204
    lazy: true
    hidden: true

