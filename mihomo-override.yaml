# ============================================================
# 规则顺序很重要：Claude > Gemini > AI > 应用专属 > 国内/全球规则 > MATCH
# 不配置 GEOIP,CN / china-ip：大陆绕过由 OpenClash 插件负责
# ============================================================
rules:
  # 局域网与私有地址
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,lan_reserved_ip,DIRECT,no-resolve
  - GEOIP,LAN,DIRECT,no-resolve

  # Claude：最高优先级，包含共享监控、客服、MCP 关键词和官方 IP 兜底
  - RULE-SET,claude,🤖 Claude
  - IP-CIDR,160.79.104.0/23,🤖 Claude,no-resolve
  - IP-CIDR,153.61.224.0/22,🤖 Claude,no-resolve
  - IP-CIDR6,2607:6bc0::/48,🤖 Claude,no-resolve
  - IP-ASN,399358,🤖 Claude,no-resolve

  # Gemini / Google AI：必须早于综合 AI
  - DOMAIN-SUFFIX,notebooklm.google.com,✨ Gemini
  - DOMAIN-SUFFIX,notebooklm.google,✨ Gemini
  - RULE-SET,gemini_extra,✨ Gemini
  - RULE-SET,gemini,✨ Gemini

  # 其他 AI：OpenAI / ChatGPT / Copilot / 其他 AI 服务
  - RULE-SET,openai,🤖 AI
  - RULE-SET,copilot,🤖 AI
  - RULE-SET,ai_domain,🤖 AI
  - RULE-SET,ai_sukka,🤖 AI

  # 广告与恶意域名
  - RULE-SET,reject_domain,🛑 广告拦截
  - RULE-SET,reject_domainset,🛑 广告拦截
  - RULE-SET,reject_non_ip_drop,🛑 广告拦截
  - RULE-SET,reject_non_ip,🛑 广告拦截
  - RULE-SET,reject_non_ip_no_drop,🛑 广告拦截
  - RULE-SET,reject_ip,🛑 广告拦截,no-resolve

  # YouTube 独立分组；Netflix 规则与其他流媒体统一进入流媒体组
  - RULE-SET,youtube,📺 YouTube
  - RULE-SET,netflix,🎬 流媒体
  - RULE-SET,telegram,✈️ 电报信息

  # Apple / Microsoft CDN 与中国区直连例外先匹配
  - RULE-SET,apple_cdn_domainset,DIRECT
  - RULE-SET,apple_cdn_non_ip,DIRECT
  - RULE-SET,apple_cn_non_ip,DIRECT
  - RULE-SET,apple_direct,DIRECT
  - RULE-SET,icloud_domain,DIRECT
  - RULE-SET,microsoft_cdn_non_ip,DIRECT

  # Apple / Microsoft 其余服务
  - RULE-SET,apple_services,🍎 苹果服务
  - RULE-SET,apple,🍎 苹果服务
  - RULE-SET,microsoft_non_ip,Ⓜ️ 微软服务
  - RULE-SET,microsoft,Ⓜ️ 微软服务

  # 游戏、GitHub、下载
  - RULE-SET,game,🎮 游戏平台
  - RULE-SET,github,⌨️ GitHub
  - RULE-SET,download_domainset,📥 文件下载
  - RULE-SET,download_non_ip,📥 文件下载

  # 其余流媒体规则进入同一个流媒体策略组
  - RULE-SET,stream_non_ip,🎬 流媒体
  - RULE-SET,stream_ip,🎬 流媒体

  # 国内常见软件与国内域名直连
  - RULE-SET,common_software,DIRECT
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_domain,DIRECT

  # 全球直连是 Sukka direct.txt 的明确列表，不等于所有海外网站直连
  - RULE-SET,direct_non_ip,🌍 全球直连

  # 通用代理规则
  - RULE-SET,global_non_ip,🎯 节点选择
  - RULE-SET,gfwlist_domain,🎯 节点选择
  - RULE-SET,non_china_tld,🎯 节点选择
  - RULE-SET,proxy_domain,🎯 节点选择

  # 漏网之鱼：前面所有规则都未命中的流量最终进入这里
  - MATCH,🐟 漏网之鱼
